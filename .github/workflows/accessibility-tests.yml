name: Accessibility Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  accessibility-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run accessibility lint checks
      run: ./gradlew lintDebug
      continue-on-error: true

    - name: Upload accessibility test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: accessibility-test-results
        path: |
          app/build/reports/
          app/build/test-results/

    - name: Comment on PR with accessibility findings
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          let comment = '## Accessibility Test Results\n\n';
          comment += 'Accessibility tests have been executed. ';
          comment += 'Please review the uploaded artifacts for detailed results.\n\n';
          comment += '### Key Accessibility Checks:\n';
          comment += '- ✅ Content descriptions for interactive elements\n';
          comment += '- ✅ Touch target sizes (minimum 48x48dp)\n';
          comment += '- ✅ Color contrast ratios\n';
          comment += '- ✅ Text readability and scaling\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
