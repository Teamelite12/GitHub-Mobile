name: Accessibility Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  accessibility-tests:
    name: Run Accessibility Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Run Lint Checks
      run: ./gradlew lintDebug
      continue-on-error: true

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Test APK
      run: ./gradlew assembleDebugAndroidTest

    # Note: Instrumented tests require an emulator or physical device
    # For demonstration, we're showing the setup. In production, you would:
    # 1. Use a cloud testing service (Firebase Test Lab, AWS Device Farm, etc.)
    # 2. Set up an emulator with hardware acceleration
    # 3. Use a self-hosted runner with nested virtualization
    
    - name: Run Unit Tests
      run: ./gradlew test
      continue-on-error: true

    # Uncomment when emulator is available
    # - name: Run Accessibility Tests on Emulator
    #   uses: reactivecircus/android-emulator-runner@v2
    #   with:
    #     api-level: 29
    #     target: default
    #     arch: x86_64
    #     profile: Nexus 6
    #     script: ./gradlew connectedAndroidTest

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          app/build/reports/
          app/build/test-results/

    - name: Upload APKs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apks
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/androidTest/debug/

  lint-accessibility:
    name: Lint for Accessibility Issues
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Android Lint
      run: ./gradlew lintDebug
      continue-on-error: true

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: app/build/reports/lint-results-debug.html
